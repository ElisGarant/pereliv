<title>ELI_S Лига</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: рабочий кабинет-дополнение к Telegram. Телефон: шапка + одна колонка + нижнее меню; ПК ≥960px: сайдбар + контент 8/4. Один акцент, остальное — графит/бумага. */
:root{
  --bg:#F4F3F0; --s1:#FFFFFF; --s2:#EFEDE9; --line:#E2DFD9; --fg:#18191C; --mute:#6A6D74; --dim:#A2A4AA;
  --acc:#C4562A; --acc-ink:#FFFFFF; --ok:#2E8A5C; --warn:#A57614; --bad:#C2413E; --acc2:#6A5AD0; --info:#2F72C4;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Unbounded","Onest",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --s1:#16171A; --s2:#1D1F23; --line:#272A2F; --fg:#ECEAE6; --mute:#8D9097; --dim:#5B5E65;
  --acc:#E07A4F; --acc-ink:#140A05; --ok:#5DBB8A; --warn:#D7A445; --bad:#E2625F; --acc2:#A497FF; --info:#6EA8EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1012; --s1:#16171A; --s2:#1D1F23; --line:#272A2F; --fg:#ECEAE6; --mute:#8D9097; --dim:#5B5E65;
  --acc:#E07A4F; --acc-ink:#140A05; --ok:#5DBB8A; --warn:#D7A445; --bad:#E2625F; --acc2:#A497FF; --info:#6EA8EC; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.btw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* shell */
.app{display:grid;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:6px;border-bottom:1px solid transparent}
.top.sc{border-color:var(--line)}
.top h1{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.02em}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--s1)}
.searchbox.search{display:none}
.tabbar{position:fixed;inset:auto 0 0;z-index:50;display:flex;background:var(--s1);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--mute);position:relative}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--fg)}
.tabbar button.on::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--acc)}

/* blocks */
.view{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);animation:in .35s var(--ease) both}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec{display:grid;gap:12px;align-content:start;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--s2);color:var(--mute);white-space:nowrap}
.tag.acc{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-weight:600;font-size:14px;background:var(--s2);border:1px solid var(--line);transition:background .15s,transform .15s;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--fg) 6%,var(--s2))}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:hover{background:color-mix(in srgb,#000 8%,var(--acc))}
.btn.s{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.w{width:100%}
.btn svg{width:16px;height:16px}
.link{color:var(--acc);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:14px;height:14px}
.bar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--fg)}
.bar.a>i{background:var(--acc)}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;background:var(--s2);color:var(--fg);border:1px solid var(--line)}
.ava.l{width:56px;height:56px;font-size:18px}
.ava.me{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;width:100%}
.item b{font-weight:600;font-size:14px;display:block}
.seg{display:inline-flex;padding:3px;background:var(--s2);border-radius:11px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;justify-self:start}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--s1);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--mute)}
.inp{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px}
textarea.inp{resize:vertical;min-height:84px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.searchbox input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:14px;outline:none}
.searchbox svg{width:17px;height:17px;color:var(--mute);flex:none}
.empty{padding:28px 12px;text-align:center;color:var(--mute);font-size:14px}

/* home */
.hello{padding:8px 0 4px}
.hello .lbl{margin-bottom:6px}
.hello h2{font-size:clamp(24px,6vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats>div{background:var(--s1);padding:14px;min-width:0}
.stats b{display:block;font-size:clamp(17px,4.6vw,26px);font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats .xs{margin-top:2px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;width:100%;text-align:left}
.todo .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--dim);flex:none;margin-top:1px;display:grid;place-items:center}
.todo .cb svg{width:13px;height:13px}
.todo.done .cb{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.todo.done b{text-decoration:line-through;color:var(--mute)}
.todo b{font-weight:600;font-size:14px;display:block}
.pin{border-left:3px solid var(--acc)}

/* orders */
.ord{display:grid;gap:10px;padding:14px 0;text-align:left;width:100%}
.ord h4{font-size:15px;font-weight:600;line-height:1.3}
.ord .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
.ord .meta b{color:var(--fg);font-weight:600}
.price{font-family:var(--mono);font-weight:500;font-size:15px;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv>div{background:var(--s2);border-radius:12px;padding:10px 12px;min-width:0}
.kv>.field{background:none;padding:0}
.kv b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.upload{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);font-size:13px;display:grid;justify-items:center;gap:6px;cursor:pointer}
.upload svg{width:20px;height:20px}
.upload input{display:none}
.upload.has{border-color:var(--ok);color:var(--fg)}

/* knowledge */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left;transition:border-color .15s}
.cat:hover{border-color:var(--dim)}
.cat.on{border-color:var(--fg)}
.cat svg{width:20px;height:20px;color:var(--mute)}
.cat b{font-size:14px;font-weight:600}
.art{display:flex;gap:12px;padding:13px 0;width:100%;text-align:left;align-items:flex-start}
.art .ic{width:36px;height:36px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--mute)}
.art .ic svg{width:18px;height:18px}
.art b{font-weight:600;font-size:14.5px;display:block;line-height:1.35}
.verified{color:var(--ok);display:inline-flex;align-items:center;gap:3px}
.verified svg{width:13px;height:13px}
.lesson{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.lesson .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:var(--mono)}
.lesson.d .n{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lesson.c .n{border-color:var(--acc);color:var(--acc)}
.lesson.l{opacity:.5}
.prose{font-size:15px;line-height:1.6;max-width:65ch}
.prose p{margin:0 0 10px}
.script{background:var(--s2);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0;border-left:3px solid var(--fg)}
.script .lbl{display:block;margin-bottom:4px}

/* community */
.composer{display:flex;gap:10px;align-items:center}
.composer .fake{flex:1;text-align:left;padding:11px 14px;border-radius:12px;background:var(--s2);color:var(--mute);font-size:14px;min-width:0}
.qtypes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.post{display:grid;gap:10px}
.post .hd{display:flex;gap:10px;align-items:center}
.post h4{font-size:15.5px;font-weight:600;line-height:1.35}
.post p{margin:0;font-size:14px;color:var(--mute)}
.media{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:12px;padding:10px 12px}
.pl{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.pl svg{width:14px;height:14px}
.wave{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:2px}
.wave i{flex:1;border-radius:2px;background:var(--dim);min-width:2px}
.wave i.p{background:var(--acc)}
.chat{background:var(--s2);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:13.5px}
.bub{max-width:82%;padding:7px 11px;border-radius:12px;background:var(--s1);border:1px solid var(--line);line-height:1.4;justify-self:start}
.bub.me{justify-self:end;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mask{background:var(--dim);color:transparent;border-radius:4px;padding:0 3px;user-select:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts .btn{background:transparent}
.acts .btn.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.inbase{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ok);font-weight:600}
.inbase svg{width:14px;height:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--s2);padding:10px 12px;border-radius:11px;font-size:13px}
.note svg{width:18px;height:18px;color:var(--warn);flex:none}

/* profile */
.pf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pf h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.grades div{font-size:11px;font-weight:600;color:var(--dim);text-align:center}
.grades div::before{content:"";display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.grades .on{color:var(--mute)}.grades .on::before{background:var(--fg)}
.grades .now{color:var(--acc)}.grades .now::before{background:var(--acc)}
.sw{position:relative;width:40px;height:24px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--s1);transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--fg)}.sw.on::after{transform:translateX(16px)}
.ref{display:flex;gap:8px;align-items:center;padding:5px 5px 5px 12px;border-radius:12px;background:var(--s2)}
.ref code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:400;padding:8px 4px}
td{padding:10px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.done-row{opacity:.5}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;bottom:0;z-index:90;width:min(620px,100%);max-height:88vh;overflow-y:auto;background:var(--s1);border-radius:20px 20px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translate(-50%,104%);visibility:hidden;transition:transform .35s var(--ease),visibility .35s}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.stack{display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;visibility:hidden;z-index:95;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:all .3s var(--ease);max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

/* balance: мягкие оттенки */
.disp{font-family:var(--disp);font-weight:600;letter-spacing:-.025em}
.hero{background:linear-gradient(125deg,color-mix(in srgb,var(--acc) 12%,var(--s1)) 0%,var(--s1) 50%,color-mix(in srgb,var(--acc2) 10%,var(--s1)) 100%);padding:20px}
.hero-t{font-size:clamp(22px,5.5vw,32px);line-height:1.15;margin-top:8px}
.ava.h1{--h:var(--acc)}.ava.h2{--h:var(--acc2)}.ava.h3{--h:var(--ok)}.ava.h4{--h:var(--warn)}.ava.h5{--h:var(--info)}
.ava[class*=" h"]{background:color-mix(in srgb,var(--h) 16%,var(--s1));color:var(--h);border-color:transparent}
.cat .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 14%,transparent)}
.cat .ci svg,.art .ic svg{color:var(--h,var(--mute))}
.art .ic{background:color-mix(in srgb,var(--h,var(--dim)) 13%,transparent)}

/* lesson */
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#0C0C0E;color:#fff;user-select:none}
.player .poster{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px 24px 70px;background:radial-gradient(70% 90% at 15% 10%,rgba(224,122,79,.45),transparent 60%),radial-gradient(70% 90% at 90% 100%,rgba(164,151,255,.35),transparent 60%),#121216;transition:filter .4s}
.player.playing .poster{filter:brightness(.55) saturate(.8)}
.player .big{width:64px;height:64px;border-radius:50%;background:#fff;color:#111;display:inline-grid;place-items:center;transition:opacity .2s,transform .2s}
.player .big svg{width:22px;height:22px;margin-left:3px}
.player .big:hover{transform:scale(1.06)}
.player.playing .big{opacity:0;pointer-events:none}
.player .yt{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;color:rgba(255,255,255,.85)}
.player .cap{position:absolute;left:16px;right:16px;bottom:64px;text-align:center;font-size:15px;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:grid;gap:6px}
.tl{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.25);cursor:pointer;margin:6px 0}
.tl::before{content:"";position:absolute;inset:-8px 0}
.tl .fill{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:3px}
.tl .mk{position:absolute;top:0;bottom:0;width:2px;background:rgba(12,12,14,.8)}
.tl .nm{position:absolute;top:-7px;width:8px;height:8px;border-radius:50%;background:#FFD27A;transform:translateX(-50%);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.cbar{display:flex;align-items:center;gap:8px;font-size:13px;color:#fff}
.cbar>button{color:#fff;display:grid;place-items:center;min-width:32px;height:32px;border-radius:8px}
.cbar>button svg{width:18px;height:18px}
.cbar>*{white-space:nowrap}

  body.insertAdjacentHTML("beforeend",msgHTML(BOTX[BOTX.length-1],k)+msgHTML(["bot","typing"],0));body.scrollTop=body.scrollHeight;
  setTimeout(()=>{const ty=body.querySelector(".typing");if(ty)ty.remove();const m=["bot","card","Распознал голосовое и собрал отчёт",{t:"Отчёт · Стоматология «Дента»",r:[["Записано","3 пациента"],["Перезвонить","1 · в среду"]]},["Отправить","Поправить"]];BOTX.push(m);body.insertAdjacentHTML("beforeend",msgHTML(m,k+1));body.scrollTop=body.scrollHeight},1100);return}
 if("off" in d){offSheet();return}

 if("offpass" in d||"warnonly" in d||"tplrepl" in d){const on=t.getAttribute("aria-checked")!=="true";t.setAttribute("aria-checked",on);t.querySelector(".sw").classList.toggle("on",on);if("tplrepl" in d)S.tplRepl=on;return}
 if("offend" in d){PD.off=null;render();toast("С возвращением");return}

  close();PD.sel=day;PD.view="day";if(S.route==="plan")planDraw();else go("plan");toast(`День заполнен: ${S.tpl.toLowerCase()}, ${TPL[S.tpl].length} задач`);return}

/* ---------- вход новичка: знакомство → уроки → тест на роль → заявка → ожидание ---------- */

 {q:"Что приятнее сделать за день?",o:[["Закрыть сделку в разговоре","call"],["Довести переписку до оплаты","msg"],["Собрать таблицу из 100 контактов","lead"],["Привести 50 человек в канал","inv"]]},
 {q:"Как ты относишься к отказам?",o:[["Нормально, это часть работы","call"],["Лучше письменно, есть время подумать","msg"],["Предпочитаю работу без лишнего общения","lead"],["Норм, если их много и быстро","inv"]]},
 {q:"Где тебе проще сосредоточиться?",o:[["В разговоре","call"],["В тексте","msg"],["В таблицах","lead"],["В потоке однотипных действий","inv"]]},
 {q:"Что из этого ты уже делал?",o:[["Продавал или работал в колл-центре","call"],["Отвечал клиентам в соцсетях","msg"],["Искал информацию для других","lead"],["Вёл или продвигал канал, чат","inv"]]},
 {q:"Какой темп тебе нравится?",o:[["Быстрый и живой","call"],["Спокойный, но с результатом","msg"],["Размеренный, сам решаю","lead"],["Много коротких задач подряд","inv"]]},
 {q:"Что для тебя важнее в работе?",o:[["Общаться с людьми","call"],["Убеждать словами","msg"],["Точность и порядок","lead"],["Видеть, как растут цифры","inv"]]},
 {q:"Задача: из 200 приглашённых через 7 дней в канале осталось 170. Какое удержание?",o:[["75%"],["80%"],["85%"],["90%"]],a:2},
 {q:"Задача: клиент пишет «дорого». Какой ответ лучше?",o:[["«Дешевле не найдёте»"],["«Хорошо, сделаю скидку»"],["«Понимаю. С чем сравниваете?»"],["«Тогда до свидания»"]],a:2}
];
const FREE=[["Что такое ELI_S team и как здесь зарабатывают","3 мин"],["Как устроен диалог с клиентом","3 мин"],["Один день из жизни инвайтера и переписчика","4 мин"]];
const OB={step:0,seen:new Set(),i:0,ans:[],dir:null,form:{h:"4–6 часов",exp:"Немного",goal:"Заработок",age:"25–34"},status:"wait"};
const STEPS=["Знакомство","Уроки","Тест","Заявка"];
function obRes(){const c={inv:0,msg:0,call:0,lead:0};OB.ans.slice(0,8).forEach((a,k)=>{const d=RQ[k].o[a][1];if(d)c[d]++});
 const smart=[8,9].filter(k=>OB.ans[k]===RQ[k].a).length;const top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return{c,smart,top}}
V.start=()=>{const st=OB.step;return `<div class="full ob">
 ${st<4?`<div class="obsteps">${STEPS.map((n,k)=>`<div class="${k<st?"d":k===st?"c":""}"><i></i><span>${n}</span></div>`).join("")}</div>`:""}
 ${[obWelcome,obLessons,obTest,obForm,obWait][st]()}</div>`};
function obWelcome(){return `
 <div class="tgchat"><div class="tgbody" style="min-height:0;max-height:none">
  <div class="msg me">/start<span class="tm">10:02</span></div>
  <div class="msg">Привет! Это ELI_S team: учим продавать и сразу даём заказы. Тебя пригласил <b>Артём К.</b><span class="tm">10:02</span></div>
  <div class="kb" style="grid-template-columns:1fr"><button data-obgo="1">Открыть ELI_S team</button></div></div></div>
 <section class="card hero"><span class="lbl">ELI_S team</span><h2 class="disp hero-t">Учись продавать и сразу зарабатывай на заказах</h2>
  <div class="list" style="margin-top:12px">${[["Учишься бесплатно","короткие уроки по 2–5 минут, тесты и разборы"],["Берёшь заказы","инвайтинг, переписка, звонки, лидген"],["Получаешь за результат","выплаты раз в неделю, всё прозрачно"]].map(([a,b],k)=>`<div class="item"><span class="mono xs" style="width:18px;color:var(--acc)">0${k+1}</span><div class="grow"><b>${a}</b><span class="xs mute">${b}</span></div></div>`).join("")}</div>
  <button class="btn pri w" style="margin-top:12px" data-obgo="1">Начать · 10 минут</button>
  <div class="xs mute" style="text-align:center;margin-top:8px">Дальше: 3 коротких урока, тест на роль и анкета. Ответ придёт в бот.</div></section>`}
function obLessons(){const n=OB.seen.size;return `
 <div><h2 class="disp" style="font-size:24px">Три коротких урока</h2><p class="sm mute" style="margin:6px 0 0">Посмотри хотя бы два, чтобы понять, чем здесь занимаются.</p></div>
 <section class="card" style="padding-block:4px"><div class="list">${FREE.map(([t,d],k)=>`<button class="lesson ${OB.seen.has(k)?"d":""}" data-oblesson="${k}" style="padding:14px 0"><span class="n">${OB.seen.has(k)?"✓":k+1}</span><span class="grow"><b class="sm" style="font-weight:600;display:block">${t}</b><span class="xs mute">${d}${OB.seen.has(k)?" · просмотрено":""}</span></span><span class="pl" style="width:32px;height:32px">${I.play}</span></button>`).join("")}</div></section>
 <div class="bar a"><i style="width:${n/3*100}%"></i></div>
 <button class="btn pri w" data-obgo="2" ${n<2?"disabled":""}>${n<2?`Посмотри ещё ${2-n}`:"Дальше: тест на роль"}</button>`}
function obTest(){if(OB.i>=RQ.length)return obResult();const q=RQ[OB.i];return `
 <div class="btw"><span class="lbl">Вопрос ${OB.i+1} из ${RQ.length}</span>${OB.i?`<button class="link" data-obback>← Назад</button>`:""}</div>
 <div class="pips">${RQ.map((_,k)=>`<i class="${k<OB.i?"ok":k===OB.i?"cur":""}"></i>`).join("")}</div>
 <h2 class="disp" style="font-size:clamp(19px,4.6vw,24px);line-height:1.25">${q.q}</h2>
 <div style="display:grid;gap:8px">${q.o.map((o,k)=>`<button class="opt ${OB.ans[OB.i]===k?"ok":""}" data-obans="${k}"><span class="k">${"АБВГ"[k]}</span><span class="grow">${o[0]}</span></button>`).join("")}</div>
 ${OB.i>=8?`<div class="xs mute">Это мини-задача на сообразительность: тут есть верный ответ.</div>`:`<div class="xs mute">Верных ответов нет, выбирай, как есть на самом деле.</div>`}`}
function obResult(){const {c,smart,top}=obRes();OB.dir=OB.dir||top;return `
 <section class="card hero"><span class="lbl">Результат теста</span><h2 class="disp hero-t">Тебе подходит: ${DIRS[top]}</h2><p class="sm mute" style="margin:6px 0 0">${DIRD[top]}.</p>
  <div style="display:grid;gap:10px;margin-top:16px">${Object.keys(DIRS).sort((a,b)=>c[b]-c[a]).map(d=>`<div><div class="btw sm"><span>${DIRS[d]}</span><span class="mono xs">${Math.round(c[d]/8*100)}%</span></div><div class="bar ${d===top?"a":""}" style="margin-top:6px"><i style="width:${c[d]/8*100}%"></i></div></div>`).join("")}</div>
  <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap"><span class="tag ${smart===2?"ok":smart?"warn":"bad"}">Задачи на сообразительность: ${smart}/2</span></div></section>
 <button class="btn pri w" data-obgo="3">Дальше: анкета</button><button class="btn w" data-obretry>Пройти тест заново</button>`}
function obForm(){const f=OB.form,ch=(k,list)=>`<div class="chips" data-obf="${k}">${list.map(v=>`<button type="button" class="${f[k]===v?"on":""}" data-obv="${v}">${v}</button>`).join("")}</div>`;return `
 <div><h2 class="disp" style="font-size:24px">Анкета</h2><p class="sm mute" style="margin:6px 0 0">2 минуты. Имя и Telegram подтянули из профиля.</p></div>
 <form class="card stack" id="obForm">
  <div class="row"><div class="ava h2">НВ</div><div class="grow"><b class="sm" style="font-weight:600;display:block">Никита В.</b><span class="xs mute">@nikita_v · из Telegram</span></div></div>
  <div class="field"><label>Направление</label><div class="chips" data-obf="dir">${Object.entries(DIRS).map(([k,n])=>`<button type="button" class="${OB.dir===k?"on":""}" data-obv="${k}">${n}${k===obRes().top?" · по тесту":""}</button>`).join("")}</div></div>

  <label class="row sm" style="gap:10px;cursor:pointer"><input type="checkbox" id="ob18" style="width:18px;height:18px;accent-color:var(--acc)"> Мне есть 18 лет, согласен с правилами команды</label>
  <button class="btn pri w" type="submit">Отправить заявку</button></form>`}
function obWait(){const s=OB.status,{top}=obRes();const T={wait:["Заявка на рассмотрении","Обычно отвечаем за 1–2 дня. Ответ придёт в бот.","warn"],ok:["Ты в команде","Добро пожаловать! Открылась Академия: начни с общего блока.","ok"],list:["Лист ожидания","Сейчас мест в направлении нет. Напишем, как только освободится.","acc"],no:["Пока не подходит","Можно подать заявку снова через 30 дней, 14 декабря.","bad"]}[s];

 if("obexit" in d){go("admin");return}
 if(d.obgo){OB.step=+d.obgo;if(OB.step===2&&OB.i>=RQ.length)OB.i=RQ.length;obDraw();return}
